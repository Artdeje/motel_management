services:
  - type: web
    name: motel-management
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SUPABASE_URL
        value: https://cnudfdpdyrplsqwmvolu.supabase.co
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: dev@fromgreenrw.org
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: dev@fromgreenrw.org
      - key: CURRENCY
        value: RWF
      - key: CURRENCY_SYMBOL
        value: Frw
      - key: APP_URL
        sync: false
